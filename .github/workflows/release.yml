name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: make test

      - name: Build Apple silicon app
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}" BUILD_NUMBER="$BUILD_NUMBER" ./scripts/build-app.sh

      - name: Package installer archive
        id: app_archive
        run: |
          set -euo pipefail
          archive="build/Flipside-app-aarch64-apple-darwin.tar.gz"
          tar -C build -czf "$archive" Flipside.app
          echo "archive_path=$archive" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          set -euo pipefail
          archive_name="$(basename "${{ steps.app_archive.outputs.archive_path }}")"
          (
            cd build
            shasum -a 256 "$archive_name" > SHA256SUMS
          )

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          archive="${{ steps.app_archive.outputs.archive_path }}"
          tar -tzf "$archive" | grep -qx 'Flipside.app/Contents/MacOS/Flipside'
          codesign --verify --deep --strict --verbose=2 build/Flipside.app
          lipo -archs build/Flipside.app/Contents/MacOS/Flipside | grep -qx arm64

          # Install from the archive exactly as a user's machine would.
          install_root="$(mktemp -d)"
          trap 'rm -rf "$install_root"' EXIT
          FLIPSIDE_APPS_DIR="$install_root/Applications" \
            FLIPSIDE_APP_ARCHIVE="$archive" \
            sh scripts/install.sh
          codesign --verify --deep --strict --verbose=2 "$install_root/Applications/Flipside.app"

      - name: Collect release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The section for this version in CHANGELOG.md, without its heading.
          awk -v v="$version" '
            /^## / { printing = ($2 == v) ; next }
            printing { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > build/RELEASE_NOTES.md
          if [[ ! -s build/RELEASE_NOTES.md ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat build/RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.app_archive.outputs.archive_path }}" \
            build/SHA256SUMS \
            --title "Flipside ${GITHUB_REF_NAME#v}" \
            --notes-file build/RELEASE_NOTES.md \
            --verify-tag
